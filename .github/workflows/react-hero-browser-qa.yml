name: React Hero Browser QA
on:
  push:
    branches:
      - feature/react-byte01-gold-standard
  workflow_dispatch:
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local production server
        run: |
          python3 -m http.server 3000 --directory out > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do if curl -fsS http://localhost:3000/ >/dev/null; then break; fi; sleep 2; done
      - run: node scripts/react-hero-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-hero-qa-react-fundamentals
          path: qa-shots/
          retention-days: 7
