<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Generative AI request flow</title><desc id="desc">A five-step flow from user instruction through context, model generation, safety controls and human review.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a2b"/><stop offset="1" stop-color="#0b4057"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".18"/></filter></defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/><text x="70" y="75" fill="#6de1e8" font-family="Inter,Arial" font-size="18" font-weight="700" letter-spacing="2">PROMPT TO TRUSTED OUTPUT</text>
  <g font-family="Inter,Arial" filter="url(#shadow)">
    <g transform="translate(55 130)"><rect width="190" height="170" rx="18" fill="#fff"/><circle cx="32" cy="34" r="16" fill="#087bed"/><text x="32" y="40" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">1</text><text x="24" y="84" fill="#071a2b" font-size="20" font-weight="700">Instruction</text><text x="24" y="114" fill="#647184" font-size="14">Goal, constraints</text><text x="24" y="137" fill="#647184" font-size="14">and output format</text></g>
    <g transform="translate(280 130)"><rect width="190" height="170" rx="18" fill="#fff"/><circle cx="32" cy="34" r="16" fill="#087bed"/><text x="32" y="40" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">2</text><text x="24" y="84" fill="#071a2b" font-size="20" font-weight="700">Context</text><text x="24" y="114" fill="#647184" font-size="14">Conversation, data</text><text x="24" y="137" fill="#647184" font-size="14">examples and rules</text></g>
    <g transform="translate(505 130)"><rect width="190" height="170" rx="18" fill="#e9fbfc" stroke="#18b6c9"/><circle cx="32" cy="34" r="16" fill="#18b6c9"/><text x="32" y="40" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">3</text><text x="24" y="84" fill="#071a2b" font-size="20" font-weight="700">Foundation model</text><text x="24" y="114" fill="#54717c" font-size="14">Generates the most</text><text x="24" y="137" fill="#54717c" font-size="14">suitable continuation</text></g>
    <g transform="translate(730 130)"><rect width="190" height="170" rx="18" fill="#fff"/><circle cx="32" cy="34" r="16" fill="#d5a94e"/><text x="32" y="40" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">4</text><text x="24" y="84" fill="#071a2b" font-size="20" font-weight="700">Controls</text><text x="24" y="114" fill="#647184" font-size="14">Safety, validation</text><text x="24" y="137" fill="#647184" font-size="14">and evaluation</text></g>
    <g transform="translate(955 130)"><rect width="190" height="170" rx="18" fill="#fff"/><circle cx="32" cy="34" r="16" fill="#3155d9"/><text x="32" y="40" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">5</text><text x="24" y="84" fill="#071a2b" font-size="20" font-weight="700">Human review</text><text x="24" y="114" fill="#647184" font-size="14">Verify, improve</text><text x="24" y="137" fill="#647184" font-size="14">and approve use</text></g>
  </g>
  <g stroke="#6de1e8" stroke-width="3" fill="none"><path d="M245 215h28"/><path d="M470 215h28"/><path d="M695 215h28"/><path d="M920 215h28"/></g><g fill="#6de1e8"><path d="m274 215-10-6v12z"/><path d="m499 215-10-6v12z"/><path d="m724 215-10-6v12z"/><path d="m949 215-10-6v12z"/></g>
  <text x="600" y="365" text-anchor="middle" fill="#bcd4dd" font-family="Inter,Arial" font-size="15">A reliable application is more than a model: context, controls and human judgement shape the final result.</text>
</svg>
